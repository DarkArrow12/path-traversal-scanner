[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traverse-scanner"
version = "0.2.0"
description = "Path traversal, file inclusion, and LFI-to-RCE testing toolkit for authorized security assessments"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
traverse = "traverse.cli:main"

[tool.setuptools.packages.find]
include = ["traverse*"]

[tool.setuptools.package-data]
traverse = ["data/*.json"]
